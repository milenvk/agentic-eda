[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-agency"
version = "0.1.0"
description = "Shared kernel of the Travel Agency application: the EventBroker port, its CloudEvents-backed Kafka adapter, and the event-type constants."
requires-python = ">=3.13"
dependencies = [
    "aiokafka==0.14.0",
    "cloudevents==2.2.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "starlette==1.6.0",  # the attachment's tests run a real lifespan
]

[tool.hatch.build.targets.wheel]
packages = ["travel_agency"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
