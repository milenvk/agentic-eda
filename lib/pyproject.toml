[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-agency"
version = "0.1.0"
description = "Shared kernel of the Travel Agency application: the EventBroker port, its Kafka adapter, and the event-type constants."
requires-python = ">=3.13"
dependencies = [
    "aiokafka==0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[tool.hatch.build.targets.wheel]
packages = ["travel_agency"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
