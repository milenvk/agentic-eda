# The state store's database: one PostgreSQL container. The tables are created by the
# component that owns them, on its first start. The data outlives `docker compose down`;
# add `--volumes` to discard it.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
      POSTGRES_DB: agency
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
