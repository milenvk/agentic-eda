[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itinerary-planner"
version = "0.1.0"
description = "The Itinerary Planner Agent: a LangGraph graph of two searches settled together, hosted by a FastAPI app with the agent container attached."
requires-python = ">=3.13"
# The travel-agency kernel (lib/) is installed alongside this package; see Dockerfile.
dependencies = [
    "fastapi==0.141.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint==4.2.0",
    "litellm==1.101.0",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["itinerary_planner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
