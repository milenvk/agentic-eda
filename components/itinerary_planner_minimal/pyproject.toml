[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itinerary-planner-minimal"
version = "0.1.0"
description = "The Itinerary Planner Agent in its chapter 1 form: a loop that calls an LLM, with no framework."
requires-python = ">=3.13"
# The travel-agency kernel (lib/) is installed alongside this package; see Dockerfile.
dependencies = [
    "litellm==1.61.8",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[tool.hatch.build.targets.wheel]
packages = ["itinerary_planner_minimal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
