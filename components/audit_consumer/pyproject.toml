[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audit-consumer"
version = "0.1.0"
description = "The Audit Consumer: appends every event to a durable record. Deterministic, and stays that way for the whole book."
requires-python = ">=3.13"
# The two libraries in lib/ are installed alongside this package; see Dockerfile.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["audit_consumer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
