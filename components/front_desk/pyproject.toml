[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "front-desk"
version = "0.1.0"
description = "The Front Desk: the application's minimal web UI. Chapter 1 form: a live view of every event."
requires-python = ">=3.13"
# The travel-agency kernel (lib/) is installed alongside this package; see Dockerfile.
dependencies = [
    "fastapi==0.115.8",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["front_desk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
