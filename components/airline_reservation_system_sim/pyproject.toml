[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airline-reservation-system-sim"
version = "0.1.0"
description = "The Airline Reservation System simulator: a seeded, deterministic REST flight supplier on the Amadeus self-service shape."
requires-python = ">=3.13"
# The travel-agency kernel (lib/) is installed alongside this package; see Dockerfile.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",  # FastAPI's test client calls the app through it
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["airline_reservation_system_sim"]
