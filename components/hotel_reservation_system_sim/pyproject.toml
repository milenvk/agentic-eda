[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotel-reservation-system-sim"
version = "0.1.0"
description = "The Hotel Reservation System simulator: a seeded, deterministic hotel supplier, its inventory served over MCP."
requires-python = ">=3.13"
# The travel-agency kernel (lib/) is installed alongside this package; see Dockerfile.
dependencies = [
    "mcp==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hotel_reservation_system_sim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
