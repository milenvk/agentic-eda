[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "booking-agent"
version = "0.1.0"
description = "The Booking Agent: an ADK custom agent over the Trip, the booking context's state, hosted by ADK's own app with the agent activator attached."
requires-python = ">=3.13"
# The two libraries in lib/ are installed alongside this package; see Dockerfile.
dependencies = [
    "fastapi==0.141.1",
    "google-adk==2.13.0",
    "litellm==1.101.0",
    "mcp==2.2.0",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["booking_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
