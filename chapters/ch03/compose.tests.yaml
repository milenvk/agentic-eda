# Chapter 3 test runners, deliberately separate from compose.yaml: tests need
# no Kafka, no model, and no `.env`. `./test.sh` loops over these.
services:
  tests-agentic-eda:
    build:
      context: ../..
      dockerfile: docker/agentic_eda.Dockerfile
    command: ["pytest", "lib/agentic_eda/tests", "-q"]

  # The library's PostgreSQL adapter against a running database.
  tests-agentic-eda-postgres:
    build:
      context: ../..
      dockerfile: docker/agentic_eda.Dockerfile
    environment:
      STATE_STORE_URL: postgresql://agency:agency@postgres:5432/agency
    command: ["pytest", "lib/agentic_eda/tests/test_postgres_state_store.py", "-q"]
    depends_on:
      postgres:
        condition: service_healthy

  tests-travel-agency:
    build:
      context: ../..
      dockerfile: docker/python.Dockerfile
    command: ["pytest", "lib/travel_agency/tests", "-q"]

  tests-supplier-world:
    build:
      context: ../..
      dockerfile: docker/python.Dockerfile
    command: ["pytest", "lib/supplier_world/tests", "-q"]

  tests-booking-agent:
    build:
      context: ../..
      dockerfile: components/booking_agent/Dockerfile
    command: ["pytest", "tests", "-q"]

  tests-itinerary-planner:
    build:
      context: ../..
      dockerfile: components/itinerary_planner/Dockerfile
    command: ["pytest", "tests", "-q"]

  tests-airline-reservation-system:
    build:
      context: ../..
      dockerfile: components/airline_reservation_system_sim/Dockerfile
    command: ["pytest", "tests", "-q"]

  tests-hotel-reservation-system:
    build:
      context: ../..
      dockerfile: components/hotel_reservation_system_sim/Dockerfile
    command: ["pytest", "tests", "-q"]

  tests-audit-consumer:
    build:
      context: ../..
      dockerfile: components/audit_consumer/Dockerfile
    command: ["pytest", "component/tests", "-q"]

  tests-chapter:
    build:
      context: ../..
      dockerfile: docker/python.Dockerfile
    volumes:
      - .:/chapter
    command: ["pytest", "/chapter/tests", "-q"]

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency
      POSTGRES_DB: agency
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency"]
      interval: 5s
      timeout: 5s
      retries: 12
