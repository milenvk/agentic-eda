# Chapter 1 — the decoupled booking workflow.
# Kafka, the Itinerary Planner Agent, and (per demo act) the audit consumer and
# the Front Desk UI. See README.md for the walkthrough.

include:
  - ../../compose/kafka.yaml
  - path: ../../compose/ollama.yaml
    env_file: ../../.env

services:
  itinerary-planner:
    build:
      context: ../..
      dockerfile: components/itinerary_planner_minimal/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FORCE_COLOR: "1"  # the event cards keep their colors in `docker compose logs`
    env_file:
      - path: ../../.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"  # host-Ollama variant works on Linux too
    depends_on:
      kafka:
        condition: service_healthy
      # Waits for the local model only when an Ollama flavor is enabled in .env.
      ollama:
        condition: service_healthy
        required: false
      ollama-gpu:
        condition: service_healthy
        required: false

  # Act 3: started live, mid-demo, without the publishers changing a line.
  audit-consumer:
    profiles: [audit]
    build:
      context: ../..
      dockerfile: components/audit_consumer/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUDIT_LOG: /data/audit.log
      FORCE_COLOR: "1"
    volumes:
      - ./data:/data
    depends_on:
      kafka:
        condition: service_healthy

  # Optional: the watch-only web UI at http://localhost:8000
  front-desk:
    profiles: [ui]
    build:
      context: ../..
      dockerfile: components/front_desk/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy

  # The customer's seat, triggered per act:
  #   docker compose --profile demo up -d --force-recreate demo
  demo:
    profiles: [demo]
    build:
      context: ../..
      dockerfile: docker/python.Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FORCE_COLOR: "1"
    volumes:
      - .:/chapter
    working_dir: /chapter
    command: ["python", "request_trip.py"]
    depends_on:
      kafka:
        condition: service_healthy
